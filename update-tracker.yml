name: Update Fantasy Football Tracker

on:
  workflow_dispatch:  # Manual trigger button
  schedule:
    - cron: '0 12 * * 1'  # Optional: Auto-run Mondays at noon UTC

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 webdriver-manager
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
      
      - name: Update player tracker
        run: |
          cd ff
          python point_tracker.py
      
      - name: Update position tracker (for users)
        run: |
          cd ff
          python new_updates.py
      
      - name: Create dashboard (player point tracker)
        run: |
          cd ff
          python create_dashboard.py
      
      - name: Create visualizations (classification/points)
        run: |
          cd ff
          python better_viz.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ visualization/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update tracker [$(date +'%Y-%m-%d %H:%M')]" && git push)
